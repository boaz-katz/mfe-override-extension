<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFE Override</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">M</div>
        <h1 class="title">MFE Override</h1>
      </div>
      <span id="active-badge" class="badge badge--inactive">none active</span>
    </header>

    <!-- ── Detected Remotes ─────────────────────────────────────────────── -->
    <div class="section-header">
      <span class="section-title">Detected Remotes</span>
      <span id="detected-count" class="badge badge--inactive">—</span>
    </div>

    <!-- Populated by popup.js; shows scanning hint / items / empty message -->
    <div id="detected-list" class="detected-list"></div>

    <!-- ── Overrides ───────────────────────────────────────────────────── -->
    <div class="section-header section-header--overrides">
      <span class="section-title">Overrides</span>
    </div>

    <div id="override-list" class="override-list" role="list"></div>

    <!-- Empty state shown when there are no configured overrides -->
    <div id="empty-state" class="empty-state">
      <p>No overrides configured.</p>
      <p class="empty-hint">Add an override to redirect a remote's<br><code>remoteEntry.json</code> to a local build.</p>
    </div>

    <!-- ── Add-override section ────────────────────────────────────────── -->
    <div class="add-section">

      <!-- Collapsed: single button -->
      <button id="add-btn" class="btn btn--primary btn--full">+ Add Override</button>

      <!-- Expanded: inline form (hidden by default) -->
      <div id="add-form" class="add-form" hidden>
        <div class="form-group">
          <label class="form-label" for="form-name">Remote name</label>
          <input id="form-name" class="form-input" type="text"
                 placeholder="e.g. map, sidebar, login" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label" for="form-original">Original URL</label>
          <input id="form-original" class="form-input" type="url"
                 placeholder="https://staging.myapp.com/map/remoteEntry.json" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label" for="form-override">Override URL</label>
          <input id="form-override" class="form-input" type="url"
                 placeholder="http://localhost:4301/remoteEntry.json" autocomplete="off" />
        </div>
        <p id="form-error" class="form-error" aria-live="polite"></p>
        <div class="form-actions">
          <button id="save-btn" class="btn btn--primary">Save</button>
          <button id="cancel-btn" class="btn btn--ghost">Cancel</button>
        </div>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
